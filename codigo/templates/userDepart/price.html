{% extends 'utils/base.html' %}
{% load sass_tags %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% sass_src 'scss/userDepart/price.scss' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    @keyframes progress {
        from {
            width: 0%;
        }
        to {
            width: 100%;
        }
    }
    
    .progress-bar {
        animation: progress 15s linear forwards;
    }
</style>
<script>
    setTimeout(function() {
        globalThis.location.href = "{% url 'codigo:user-depart' %}";
    }, 15000);
</script>
{% endblock head %}

{% block content %}
<div class="container" style="background-color: black; min-height: 100vh; padding: 0; margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column;">
    <div style="width: 100%; height: 8px; background-color: #FFC700;"></div>
    
    <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 0; font-size: 18px; font-weight: 700; color: white; font-family: 'Inter', sans-serif;">Zé Clovis - Estacionamento</h1>
        <div style="background-color: #FFC700; color: black; padding: 8px 16px; font-weight: 700; font-size: 14px;">
            👁 FICAREMOS DE OLHO
        </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column;">
        <div style="background-color: #1a1a1a; padding: 40px 60px; margin: 20px 20px 0 20px; position: relative; display: flex; align-items: center;">
            <h2 style="margin: 0; font-size: 48px; font-weight: 900; color: white; font-family: 'Inter', sans-serif;">Valor a pagar</h2>
            <div style="position: absolute; right: 60px; top: 50%; transform: translateY(-50%); font-size: 80px; font-weight: 900; color: white;">↓</div>
        </div>

        <div style="background-color: #6EFF5C; padding: 60px; margin: 0 20px 20px 20px; flex: 1; display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 80px; font-weight: 900; color: black;">💰</div>
            <div style="font-size: 100px; font-weight: 900; color: black; font-family: 'Inter', sans-serif; line-height: 1;">R$ {{ preco }}</div>
        </div>
    </div>

    <div style="width: 100%; height: 12px; background-color: black;">
        <div class="progress-bar" style="height: 100%; background-color: #3B82F6; width: 0%;"></div>
    </div>
</div>
{% endblock content %}
