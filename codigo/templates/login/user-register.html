{% extends 'utils/base.html' %}
{% load sass_tags %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% sass_src 'scss/login/user-register.scss' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
{% endblock head %}

{% block content %}
<div class="container-home" style="background-color: #f5f5f5; min-height: 100vh; padding: 0; margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column;">
    <div style="width: 100%; height: 8px; background-color: #93BCF2;"></div>
    
    <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center; background-color: #f5f5f5;">
        <a href="{% url 'codigo:admin-home' %}" style="background-color: #93BCF2; color: black; padding: 6px 12px; text-decoration: none; font-weight: 700; font-size: 12px; display: inline-block;">
            ↖ VOLTAR
        </a>
        <h1 style="margin: 0; font-size: 16px; font-weight: 700; color: black; font-family: 'Inter', sans-serif;">Zé Clovis - Estacionamento</h1>
    </div>

    <div class="main" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px;">
        <div style="width: 100%; max-width: 400px;">
            <form action="" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                {% csrf_token %}
                
                <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 700; color: black; font-family: 'Inter', sans-serif; text-align: center;">Novo Usuário</h2>
                
                <input id="username" name="userName" type="text" placeholder="Nome do Usuário" 
                    style="width: 100%; padding: 12px 16px; font-size: 14px; background-color: white; border: 2px solid #d0d0d0; color: #666; font-family: 'Inter', sans-serif; box-sizing: border-box; border-radius: 0;">
                
                <input id="cpfInput" name="cpf" type="text" placeholder="CPF" 
                    style="width: 100%; padding: 12px 16px; font-size: 14px; background-color: white; border: 2px solid #d0d0d0; color: #666; font-family: 'Inter', sans-serif; box-sizing: border-box; border-radius: 0;">
                
                <button type="submit" style="width: 100%; padding: 12px; background-color: #93BCF2; color: black; border: none; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; border-radius: 0; margin-top: 5px;">
                    Cadastrar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
