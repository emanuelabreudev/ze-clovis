{% extends 'utils/base.html' %}
{% load sass_tags %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% sass_src 'scss/login/login.scss' %}">
{% endblock head %}

{% block content %}
<div class="container">
    <div
        style="width: 98%; height: 10px; background-color: #93BCF2; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;">
    </div>

    <div
        style="width: 98%; position: absolute; left: 50%; transform: translateX(-50%); top: 30px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0px; box-sizing: border-box;">
        <h2 style="margin: 0; font-size: 18px; font-weight: bold; color: black;">Zé Clovis - Estacionamento</h2>
        <button
            style="background-color: #93BCF2; color: black; border: none; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500;">
            ↖ VOLTAR PARA PRINCIPAL
        </button>
    </div>

    <div class="main">
        <form style="align-items: center;" action="" method="post">
            <h2 style="color: black; font-size: medium;">Entrar como Admin</h2>

            {% csrf_token %}
            <input style="width: 80%; border: 1px solid #A5A5A8; border-radius: 0px; background-color: transparent;"
                name="email" type="email" placeholder="E-mail">
            <input
                style="margin-top: -30px; width: 80%; border: 1px solid #A5A5A8; border-radius: 0px; background-color: transparent;"
                name="password" type="password" placeholder="Senha">

            <button style="width: 80%; border-radius: 0px; background-color: #93BCF2; color: black; font-size: small;">
                Entrar
            </button>
            <button
                style="margin-top: -30px; width: 80%; border-radius: 0px; background-color: black; color: white; font-size: small;">
                Esqueceu a senha?
            </button>
        </form>
    </div>
</div>
{% endblock content %}
