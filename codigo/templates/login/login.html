{% extends 'utils/base.html' %}
{% load sass_tags %}
{% load static %}


{% block head %}
<link rel="stylesheet" href="{% sass_src 'scss/login/login.scss' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
{% endblock head %}


{% block content %}
<div class="container">
    <div style="width: 98%; height: 10px; background-color: #93BCF2; position: absolute; left: 50%; transform: translateX(-50%); top: 10px;"></div>

    <div style="width: 98%; position: absolute; left: 50%; transform: translateX(-50%); top: 30px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0px; box-sizing: border-box;">
        <h1 style="margin: 0; font-size: 18px; font-weight: bold; color: black; font-family: 'Inter', sans-serif;">Zé Clovis - Estacionamento</h1>
        <a href="{% url 'codigo:home' %}" style="background-color: #93BCF2; color: black; border: none; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-block; font-family: 'Inter', sans-serif;">
            ↖ VOLTAR PARA PRINCIPAL
        </a>
    </div>    

    <div class="main">
        <form style="align-items: center;" action="" method="post">
            <h2 style="color: black; font-size: medium;">Entrar como Admin</h2>

            {% csrf_token %}
            <input style="width: 80%; border: 1px solid #A5A5A8; border-radius: 0px; background-color: transparent;"
                name="email" type="email" placeholder="E-mail">
            <input
                style="margin-top: -30px; width: 80%; border: 1px solid #A5A5A8; border-radius: 0px; background-color: transparent;"
                name="password" type="password" placeholder="Senha">

            <button type="submit" style="width: 80%; border-radius: 0px; background-color: #93BCF2; color: black; font-size: small;">
                Entrar
            </button>
            <a href="{% url 'codigo:password-reset-request' %}"
                style="margin-top: -30px; width: 80%; border-radius: 0px; background-color: black; color: white; font-size: small; display: flex; align-items: center; justify-content: center; padding: 12px; text-decoration: none; cursor: pointer; border: none;">
                Esqueceu a senha?
            </a>
        </form>
    </div>
</div>
{% endblock content %}
