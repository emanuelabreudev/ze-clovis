{% extends 'utils/base.html' %}
{% load sass_tags %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% sass_src 'scss/login/home.scss' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    .card-button {
        text-decoration: none;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 15px;
        transition: all 0.3s ease;
    }
    
    .card-button.blue {
        background-color: #93BCF2;
    }
    
    .card-button.black {
        background-color: black;
    }
    
    .card-button:hover {
        background-color: white !important;
    }
    
    .card-button:hover .card-icon,
    .card-button:hover .card-title {
        color: #93BCF2 !important;
    }
    
    .card-icon {
        width: 64px;
        height: 64px;
        transition: color 0.3s ease;
    }
    
    .card-title {
        margin: 0;
        font-size: 24px;
        font-weight: 400;
        font-family: 'Inter', sans-serif;
        transition: color 0.3s ease;
    }
</style>
{% endblock head %}

{% block content %}
<div class="container-home" style="background-color: #f5f5f5; min-height: 100vh; padding: 0; margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column;">
    <div style="width: 100%; height: 8px; background-color: #93BCF2;"></div>
    
    <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center; background-color: #f5f5f5;">
        <h1 style="margin: 0; font-size: 16px; font-weight: 700; color: black; font-family: 'Inter', sans-serif;">Zé Clovis - Estacionamento</h1>
        <a href="/" style="background-color: #93BCF2; color: black; padding: 6px 12px; text-decoration: none; font-weight: 700; font-size: 12px; display: inline-block;">
            ↖ SAIR
        </a>
    </div>

    <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0; padding: 0; margin: 0;">
        
        <a href="{% url 'codigo:admin-user-register' %}" class="card-button blue">
            <i data-lucide="user-plus" class="card-icon" style="color: black;"></i>
            <h2 class="card-title" style="color: black;">Novo Usuário</h2>
        </a>

        <a href="{% url 'codigo:admin-log' %}" class="card-button black">
            <i data-lucide="database" class="card-icon" style="color: white;"></i>
            <h2 class="card-title" style="color: white;">Registros</h2>
        </a>

        <a href="{% url 'codigo:admin-config' %}" class="card-button black" style="grid-column: 1 / -1;">
            <i data-lucide="settings" class="card-icon" style="color: white;"></i>
            <h2 class="card-title" style="color: white;">Configurações</h2>
        </a>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
{% endblock content %}
